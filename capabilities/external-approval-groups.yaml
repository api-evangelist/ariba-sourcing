naftiko: 1.0.0-alpha2
info:
  label: Ariba Sourcing - External Approval API — Groups
  description: 'Ariba Sourcing - External Approval API — Groups. 1 operations. Lead operation: Ariba Sourcing List Approval
    Group Members. Self-contained Naftiko capability covering one Ariba Sourcing business surface.'
  tags:
  - Ariba Sourcing
  - Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ARIBA_SOURCING_API_KEY: ARIBA_SOURCING_API_KEY
capability:
  consumes:
  - type: http
    namespace: external-approval-groups
    baseUri: https://openapi.ariba.com/api/sourcing-approval/v2/prod
    description: Ariba Sourcing - External Approval API — Groups business capability. Self-contained, no shared references.
    resources:
    - name: groups-group_id-members
      path: /groups/{group_id}/members
      operations:
      - name: listgroupmembers
        method: GET
        description: Ariba Sourcing List Approval Group Members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: group_id
          in: path
          type: string
          description: The group identifier.
          required: true
        - name: realm
          in: query
          type: string
          description: The SAP Ariba realm name.
          required: true
    authentication:
      type: bearer
      token: '{{env.ARIBA_SOURCING_API_KEY}}'
  exposes:
  - type: rest
    namespace: external-approval-groups-rest
    port: 8080
    description: REST adapter for Ariba Sourcing - External Approval API — Groups. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/groups/{group-id}/members
      name: groups-group-id-members
      description: REST surface for groups-group_id-members.
      operations:
      - method: GET
        name: listgroupmembers
        description: Ariba Sourcing List Approval Group Members
        call: external-approval-groups.listgroupmembers
        with:
          group_id: rest.group_id
          realm: rest.realm
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: external-approval-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Ariba Sourcing - External Approval API — Groups. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: ariba-sourcing-list-approval-group
      description: Ariba Sourcing List Approval Group Members
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: external-approval-groups.listgroupmembers
      with:
        group_id: tools.group_id
        realm: tools.realm
      outputParameters:
      - type: object
        mapping: $.
